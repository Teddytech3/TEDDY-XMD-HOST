<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEDDY-XMD BOT DEPLOYER</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07070f;--bg2:#0d0d1a;--card:#141428;--border:#252545;
      --p:#7c3aed;--pl:#9f6ff5;--pglow:rgba(124,58,237,.25);
      --acc:#06b6d4;--aglow:rgba(6,182,212,.18);
      --grn:#10b981;--red:#ef4444;--ylw:#f59e0b;
      --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
      --r:14px;--rsm:9px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh}
   .nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(7,7,15,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px}
   .logo{font-size:1.15rem;font-weight:800;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
   .nbtn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:.82rem;font-weight:500;transition:all.2s}
   .nbtn.ghost{background:transparent;color:var(--tx2);border:1px solid var(--border)}
   .nbtn.ghost:hover{border-color:var(--p);color:var(--pl)}
   .nbtn.pri{background:var(--p);color:#fff}
   .nbtn.warn{color:var(--ylw);border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
   .page{display:none;padding-top:68px;min-height:100vh}
   .page.active{display:block}
   .wrap{max-width:1060px;margin:0 auto;padding:36px 20px}
   .hero{text-align:center;padding:70px 20px 50px}
   .hero h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;line-height:1.1;margin-bottom:18px}
   .hero h1 span{background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
   .btn{padding:12px 24px;border-radius:10px;border:none;cursor:pointer;font-size:.95rem;font-weight:600;transition:all.2s;display:inline-flex;align-items:center;gap:7px}
   .btn-pri{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:0 4px 18px var(--pglow)}
   .btn-out{background:transparent;color:var(--tx);border:1px solid var(--border)}
   .btn-red{background:var(--red);color:#fff}
   .sm{padding:7px 14px;font-size:.82rem;border-radius:7px}
   .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px}
   .cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
   .fg{margin-bottom:18px}
   .fg label{display:block;font-size:.82rem;font-weight:600;color:var(--tx2);margin-bottom:7px}
   .fg input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:11px 14px;color:var(--tx);outline:none}
   .fg input:focus{border-color:var(--p)}
   .alert{padding:11px 14px;border-radius:8px;font-size:.88rem;margin-bottom:14px}
   .ae{background:rgba(239,68,68,.1);border:1px solid var(--red);color:#fca5a5}
   .as{background:rgba(16,185,129,.1);border:1px solid var(--grn);color:#6ee7b7}
   .bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600}
   .bg{background:rgba(16,185,129,.15);color:var(--grn);border:1px solid rgba(16,185,129,.3)}
   .br{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
   .ld{width:17px;height:17px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
   .tabs{display:flex;gap:3px;background:var(--bg2);border-radius:10px;padding:4px;margin-bottom:24px}
   .tab{flex:1;text-align:center;padding:9px;border-radius:7px;cursor:pointer;font-size:.87rem;color:var(--tx2)}
   .tab.active{background:var(--card);color:var(--tx)}
   .lbox{max-width:460px;margin:50px auto;padding:0 20px}
   .dash{max-width:860px;margin:0 auto;padding:28px 20px}
   .uh{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(6,182,212,.06));border:1px solid rgba(124,58,237,.25);border-radius:var(--r);padding:22px 26px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
   .botcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
   .appname{font-family:'Fira Code',monospace;font-size:1rem;font-weight:600;margin-bottom:5px}
   .botacts{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
   .plancard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;text-align:center}
   .pp{font-size:2.2rem;font-weight:800;margin:14px 0 4px}
   .pf{list-style:none;text-align:left;margin:16px 0 20px}
   .pf li{padding:5px 0;color:var(--tx2);font-size:.87rem;display:flex;align-items:center;gap:9px}
   .pf li::before{content:'✓';color:var(--grn);font-weight:700}
   .notif{position:fixed;top:70px;right:20px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:.88rem;transform:translateX(200%);transition:transform.3s}
   .notif.show{transform:translateX(0)}
   .notif.ok{border-left:3px solid var(--grn)}
   .notif.err{border-left:3px solid var(--red)}
  </style>
</head>
<body>

<div class="notif" id="notif"></div>

<nav class="nav">
  <div class="logo">🤖 TEDDY-XMD BOT DEPLOYER</div>
  <div>
    <button class="nbtn ghost" onclick="go('home')">Home</button>
    <button class="nbtn ghost" onclick="go('plans')">Plans</button>
    <button class="nbtn ghost" id="btnLogin" onclick="go('login')">Login</button>
    <button class="nbtn ghost" id="btnLogout" style="display:none" onclick="logout()">Logout</button>
    <button class="nbtn warn" onclick="go('admin')">⚙ Admin</button>
  </div>
</nav>

<div id="pg-home" class="page active">
  <div class="hero">
    <h1>Deploy <span>TEDDY-XMD</span><br/>Instantly to Heroku</h1>
    <p style="color:var(--tx2);max-width:520px;margin:0 auto 34px">Fork the repo, enter your Session ID, and your bot goes live in minutes.</p>
    <button class="btn btn-pri" onclick="go('login')">🚀 Get Started Free</button>
  </div>
</div>

<div id="pg-login" class="page">
  <div class="lbox">
    <div class="card">
      <h2 style="margin-bottom:6px;font-size:1.5rem">🔐 Sign In</h2>
      <div id="loginAlert"></div>
      <div class="fg">
        <label>GitHub Username</label>
        <input id="loginUser" type="text" placeholder="e.g. Teddytech1" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn btn-pri" style="width:100%" onclick="doLogin()" id="loginBtn">Verify & Login</button>
    </div>
  </div>
</div>

<div id="pg-dash" class="page">
  <div class="dash">
    <div class="uh">
      <div><div style="font-size:1.2rem;font-weight:700" id="dhName">👋 Welcome!</div><div style="color:var(--tx2);font-size:.85rem" id="dhSub">Loading...</div></div>
      <div id="dhBadge"></div>
    </div>

    <div class="tabs">
      <div class="tab active" id="t-deploy" onclick="switchTab('deploy')">🚀 Deploy Bot</div>
      <div class="tab" id="t-mybots" onclick="switchTab('mybots')">🤖 My Bots</div>
    </div>

    <div id="tab-deploy">
      <div id="dAlert"></div>
      <div class="card">
        <div class="fg">
          <label>Session ID <span style="color:var(--red)">*</span></label>
          <input id="d-session" placeholder="Paste your session ID here"/>
        </div>
        <button class="btn btn-pri" onclick="deployBot()" id="deployBtn">🚀 Deploy to Heroku</button>
      </div>
    </div>

    <div id="tab-mybots" style="display:none"><div id="botsContainer"></div></div>
  </div>
</div>

<div id="pg-plans" class="page">
  <div class="wrap">
    <h2 style="text-align:center;margin-bottom:42px;font-size:1.8rem">Choose Your Plan</h2>
    <div id="plansGrid" class="cgrid"></div>
  </div>
</div>

<div id="pg-admin" class="page" style="padding-top:60px">
  <div id="adminLogin" style="max-width:400px;margin:50px auto;padding:0 20px">
    <div class="card">
      <h2>🔒 Admin Panel</h2>
      <div id="aLoginAlert"></div>
      <div class="fg"><label>Admin Password</label><input type="password" id="adminPwd" value="teddy" onkeydown="if(event.key==='Enter')doAdminLogin()"/></div>
      <button class="btn btn-pri" style="width:100%" onclick="doAdminLogin()">Login</button>
    </div>
  </div>
  <div id="adminDash" style="display:none;padding:28px 24px">
    <div id="at-users"></div>
  </div>
</div>

<script>
const API_BASE = '';
let CU = null;
let AP = null;
let WHATSAPP_NUMBER = '254700000';

function notif(msg, type='info') {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.className = `notif show ${type==='success'?'ok':'err'}`;
  setTimeout(() => n.classList.remove('show'), 3500);
}
function alert2(id, msg, cls='ae') {
  document.getElementById(id).innerHTML = msg? `<div class="alert ${cls}">${msg}</div>` : '';
}
function go(pg) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('pg-' + pg).classList.add('active');
  if (pg === 'plans') loadPlans();
  if (pg === 'dash') loadDash();
}
function v(id) { return document.getElementById(id)?.value.trim() || ''; }

async function post(url, body) {
  try {
    const r = await fetch(API_BASE + url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return await r.json();
  } catch (e) {
    return { error: 'Network error: ' + e.message };
  }
}

window.addEventListener('load', () => {
  const s = localStorage.getItem('teddy_user');
  if (s) {
    CU = JSON.parse(s);
    document.getElementById('btnLogin').style.display = 'none';
    document.getElementById('btnLogout').style.display = '';
  }
  loadPlans();
});

function logout() {
  CU = null; AP = null;
  localStorage.removeItem('teddy_user');
  document.getElementById('btnLogin').style.display = '';
  document.getElementById('btnLogout').style.display = 'none';
  go('home');
}

async function doLogin() {
  const username = v('loginUser');
  if (!username) return alert2('loginAlert', '⚠️ Enter your GitHub username');
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<span class="ld"></span> Verifying...';
  btn.disabled = true;
  alert2('loginAlert', '');
  const data = await post('/check-fork', { githubUsername: username });
  btn.innerHTML = 'Verify & Login';
  btn.disabled = false;
  if (data.error) return alert2('loginAlert', '❌ ' + data.error);
  if (data.forkError) return alert2('loginAlert', '❌ GitHub API error: ' + data.forkError);
  if (!data.hasFork) return alert2('loginAlert', '❌ Fork not found. Fork https://github.com/Teddytech1/TEDDY-XMD first');
  if (data.isBanned) return alert2('loginAlert', '❌ Account banned');
  CU = { username: username.toLowerCase(),...data };
  localStorage.setItem('teddy_user', JSON.stringify(CU));
  document.getElementById('btnLogin').style.display = 'none';
  document.getElementById('btnLogout').style.display = '';
  go('dash');
}

async function loadDash() {
  if (!CU) return go('login');
  const data = await post('/check-fork', { githubUsername: CU.username });
  CU = {...CU,...data };
  localStorage.setItem('teddy_user', JSON.stringify(CU));
  document.getElementById('dhName').textContent = `👋 ${CU.username}`;
  document.getElementById('dhSub').textContent = `Plan: ${CU.subscriptionPlan} · Bots: ${CU.currentBots}/${CU.maxBots}`;
  document.getElementById('dhBadge').innerHTML = CU.isBanned? '<span class="bdg br">Banned</span>' : '<span class="bdg bg">Active</span>';
  loadMyBots();
}

function switchTab(name) {
  ['deploy','mybots'].forEach(t => {
    document.getElementById('t-'+t).classList.toggle('active', t===name);
    document.getElementById('tab-'+t).style.display = t===name? 'block':'none';
  });
  if (name==='mybots') loadMyBots();
}

async function deployBot() {
  if (!CU) return go('login');
  const session = v('d-session');
  if (!session) return alert2('dAlert', '⚠️ Session ID required', 'ae');
  const btn = document.getElementById('deployBtn');
  btn.innerHTML = '<span class="ld"></span> Deploying...';
  btn.disabled = true;
  alert2('dAlert', '');
  const data = await post('/deploy', { githubUsername: CU.username, sessionId: session });
  btn.innerHTML = '🚀 Deploy to Heroku';
  btn.disabled = false;
  if (data.error) {
    alert2('dAlert', '❌ ' + data.error, 'ae');
  } else {
    alert2('dAlert', `✅ ${data.message}`, 'as');
    notif('🎉 Bot deployed!', 'success');
    loadMyBots();
  }
}

async function loadMyBots() {
  if (!CU) return;
  const c = document.getElementById('botsContainer');
  const data = await post('/check-fork', { githubUsername: CU.username });
  const bots = data.deployedBots || [];
  if (!bots.length) {
    c.innerHTML = `<div style="text-align:center;padding:50px;color:var(--tx3)">No bots deployed yet</div>`;
    return;
  }
  c.innerHTML = bots.map(b => `
    <div class="botcard">
      <div class="appname">🤖 ${b.app_name}</div>
      <div style="color:var(--tx3);font-size:.8rem">${b.created_at? new Date(b.created_at).toLocaleDateString() : ''}</div>
      <div class="botacts">
        <button class="btn btn-red sm" onclick="deleteMyBot('${b.app_name}')">🗑️ Delete</button>
      </div>
    </div>
  `).join('');
}

async function deleteMyBot(appName) {
  if (!confirm(`Delete bot "${appName}"?`)) return;
  const d = await post('/delete-app', { appName, githubUsername: CU.username });
  notif(d.message || 'Deleted', d.success? 'success' : 'error');
  if (d.success) loadMyBots();
}

async function loadPlans() {
  const g = document.getElementById('plansGrid');
  if (!g) return;
  try {
    const r = await fetch(API_BASE + '/api/plans');
    const { plans, whatsapp } = await r.json();
    WHATSAPP_NUMBER = whatsapp;
    g.innerHTML = (plans||[]).map(p => {
      const isFree = p.name.toLowerCase() === 'free';
      const waMsg = encodeURIComponent(`Hi Teddy, I want to upgrade to ${p.name} plan. My GitHub: ${CU?.username || 'not logged in'}`);
      const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;
      return `
        <div class="plancard">
          <div style="font-size:.78rem;color:var(--tx3);font-weight:600">${p.name}</div>
          <div class="pp">${p.price}</div>
          <div style="color:var(--tx3);font-size:.82rem">${p.duration_days} days · ${p.max_bots} bots</div>
          <ul class="pf">${(p.features||[]).map(f=>`<li>${f}</li>`).join('')}</ul>
          ${isFree
           ? '<button class="btn btn-out" disabled>Current Plan</button>'
            : `<button class="btn btn-pri" onclick="window.open('${waLink}','_blank')">💬 Contact on WhatsApp</button>`
          }
        </div>`;
    }).join('');
  } catch { g.innerHTML = '<div style="color:var(--tx3)">Failed to load plans</div>'; }
}

async function doAdminLogin() {
  const pwd = v('adminPwd');
  const data = await post('/admin/login', { password: pwd });
  if (data.success) {
    AP = pwd;
    document.getElementById('adminLogin').style.display = 'none';
    document.getElementById('adminDash').style.display = 'block';
    const users = await post('/admin/users', { password: AP });
    document.getElementById('at-users').innerHTML = `<pre style="color:var(--tx2)">${JSON.stringify(users.users, null, 2)}</pre>`;
  } else {
    alert2('aLoginAlert', '❌ Invalid password', 'ae');
  }
}
</script>
</body>
</html>
